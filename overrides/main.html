{% extends "base.html" %}

<!-- Hide site_nav unless YAML metadata has `show_toc: true` -->
{% block site_nav %}
  {% set nav_html = super() %}
  {% if page and page.meta and page.meta.show_toc %}
    {{ nav_html }}
  {% else %}
    {{ nav_html | replace('data-md-type="toc"', 'data-md-type="toc" hidden') | safe }}
  {% endif %}
{% endblock %}
